%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/realtek,taurus-usb3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek SoCs USB3 PHY devicetree bindings

maintainers:
  - Darren Wu <darren_wu@realtek.com>

properties:
  compatible:
    items:
      - enum:
          - realtek,taurus-usb3phy # For taurus
          - realtek,elnath-usb3phy # For elnath

  reg:
    minItems: 4
    items:
      - description: usb3 phy host control register.
      - description: usb3 phy ext host control register.
      - description: usb phy s2 register.
      - description: usb phy s3 register.

  reg-names:
    minItems: 4
    items:
      - const: u3host_reg
      - const: u3ext_reg
      - const: s2usbphy_u3port
      - const: s3usbphy_u3port

  ranges: true

  phys:
    minItems: 2
    description: S2 phy node
    description: S3 phy node

  phy-names:
    minItems: 2
    items:
      - const: s2usb3-phy
      - const: s3usb3-phy

  phymask:
    description: Select which usb port be used 0:S2 1:S3

  phy_data_verA:
    description: usb3 phy data version string

  phy_data_addrA:
    description: usb3 revA phy address array, it correspond phy_data_arrayA.

  phy_data_arrayA:
    description: usb3 revA phy data array, it correspond phy_data_addrA.

  phy_data_verA_40M:
    description: xtal 40M usb3 phy data version string

  phy_data_addrA_40M:
    description: xtal 40M usb3 revA phy address array, it correspond phy_data_arrayA_40M.

  phy_data_arrayA_40M:
    description: xtal 40M usb3 revA phy data array, it correspond phy_data_addrA_40M.

  s2_usb_phy:
    description: specifies usb2 phy node.

required:
  - compatible
  - reg
  - reg-names
  - phys
  - phy-names
  - phymask
  - phy_data_verA
  - phy_data_addrA
  - phy_data_arrayA
  - phy_data_verA_40M
  - phy_data_addrA_40M
  - phy_data_arrayA_40M
  - usb2-phy

additionalProperties: false

examples:
  - |
    #include <dt-bindings/phy/phy-rtl8277c.h>

    usb_ssphy: usbphy@f432b000 {
        compatible = "realtek,elnath-usb3phy";
        reg = <0x0 0xf432b000 0x0 0x20>,
            <0 0xf432b04c 0x0 0x10>,
            <0 0xf4337000 0x0 0x1000>,
            <0 0xf4338000 0x0 0x1000>;
        reg-names = "u3host_reg", "u3ext_reg", "s2usbphy_u3port", "s3usbphy_u3port";
        #address-cells = <2>;
        #size-cells = <2>;
        ranges;

        phys = <&s2_usb_phy>, <&s3_usb_phy>;
        phy-names = "s2usb3-phy", "s3usb3-phy";

        phymask = <0x2>;
        phy_data_verA = "revA v1.0 (2020.01.01)";
        phy_data_addrA = /bits/ 8
             <>;
        phy_data_arrayA = /bits/ 16
             <>;

        phy_data_verA_40M = "revA v1.0 (2020.01.01)";
        phy_data_addrA_40M = /bits/ 8
             <;
        phy_data_arrayA_40M = /bits/ 16
             <>;
        usb2-phy = <&usb_hsphy>;
    };